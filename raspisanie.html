<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <title>Расписание пар</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script>
    // Тема применяется ДО рендера — чтобы не мигало
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div class="app">
    <header>
      <div class="header-text">
        <h1>📅 Расписание пар</h1>
        <p>Общее для всех друзей</p>
      </div>
      <button class="theme-btn" id="theme-toggle" title="Сменить тему">🌙</button>
    </header>

    <div class="card">
      <h2>Твоё имя</h2>
      <input type="text" id="name" placeholder="Например, Аня" maxlength="20" autocomplete="off">

      <h2 style="margin-top:14px;">Расписание на день</h2>
      <div id="pairs"></div>

      <div class="legend">
        <span><i style="background:var(--cell-class-bg)"></i>пара</span>
        <span><i style="background:var(--cell-window-bg)"></i>окно</span>
        <span><i style="background:var(--cell-home-bg)"></i>домой</span>
      </div>

      <button class="btn btn-primary" id="save">💾 Сохранить</button>
    </div>

    <div class="card">
      <div class="list-header">
        <h2>Кто когда учится</h2>
        <button class="refresh-btn" id="refresh">🔄 Обновить</button>
      </div>
      <div id="list"><p class="loading">Загрузка…</p></div>
    </div>

    <footer>Общее расписание для всех друзей</footer>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
  (function () {
    const SUPABASE_URL = window.SUPABASE_URL;
    const SUPABASE_KEY = window.SUPABASE_KEY;

    const PAIRS = [
      { n: 1, time: '8:30–9:50' },
      { n: 2, time: '10:00–11:20' },
      { n: 3, time: '11:30–12:50' },
      { n: 4, time: '13:00–14:20' },
      { n: 5, time: '14:30–15:50' },
      { n: 6, time: '16:00–17:20' }
    ];

    // Иконки в ячейках
    const ICONS = {
      class: '📚',
      window: '☕',
      home: '🏠'
    };

    const NAME_KEY = 'my-name';
    const state = {};
    PAIRS.forEach(p => state[p.n] = 'home');

    const nameEl = document.getElementById('name');
    const pairsEl = document.getElementById('pairs');
    const listEl = document.getElementById('list');
    const saveBtn = document.getElementById('save');
    const refreshBtn = document.getElementById('refresh');
    const toastEl = document.getElementById('toast');
    const themeBtn = document.getElementById('theme-toggle');

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ---------- Тема ----------
    function updateThemeBtn() {
      const current = document.documentElement.getAttribute('data-theme');
      themeBtn.textContent = current === 'dark' ? '☀️' : '🌙';
    }
    themeBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeBtn();
    });
    updateThemeBtn();

    // ---------- Toast ----------
    let toastTimer;
    function toast(msg, isError) {
      toastEl.textContent = msg;
      toastEl.classList.toggle('error', !!isError);
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    // ---------- Форма: сетка пар ----------
    function renderPairs() {
      pairsEl.innerHTML = PAIRS.map(p => `
        <div class="pair-row" data-pair="${p.n}">
          <div class="pair-label">
            ${p.n} пара
            <small>${p.time}</small>
          </div>
          <div class="segmented">
            <button data-val="class" data-pair="${p.n}">Пара</button>
            <button data-val="window" data-pair="${p.n}">Окно</button>
            <button data-val="home" data-pair="${p.n}">Домой</button>
          </div>
        </div>
      `).join('');

      pairsEl.querySelectorAll('.segmented button').forEach(btn => {
        btn.addEventListener('click', () => {
          state[btn.dataset.pair] = btn.dataset.val;
          highlightPair(btn.dataset.pair);
        });
      });
      PAIRS.forEach(p => highlightPair(p.n));
    }

    function highlightPair(n) {
      const row = pairsEl.querySelector(`.pair-row[data-pair="${n}"]`);
      row.querySelectorAll('button').forEach(b => {
        b.classList.toggle('active', b.dataset.val === state[n]);
      });
    }

    function resetForm() {
      PAIRS.forEach(p => state[p.n] = 'home');
      PAIRS.forEach(p => highlightPair(p.n));
    }

    // ---------- Загрузка ----------
    async function loadAndRender() {
      listEl.innerHTML = '<p class="loading">Загрузка…</p>';
      const { data, error } = await sb
        .from('schedules')
        .select('name, schedule, updated_at')
        .order('updated_at', { ascending: true });

      if (error) {
        listEl.innerHTML = '<p class="empty">Ошибка загрузки. Проверь таблицу и ключи.</p>';
        console.error(error);
        toast('Ошибка загрузки', true);
        return;
      }
      const myName = (localStorage.getItem(NAME_KEY) || '').toLowerCase();
      renderTable(data || [], myName);
    }

    // ---------- Рендер таблицы-расписания ----------
    function renderTable(data, myName) {
      if (!data.length) {
        listEl.innerHTML = '<p class="empty">Пока никого нет. Добавь первого!</p>';
        return;
      }

      // Сортировка: сначала те, у кого первая "не дом" пара раньше
      data.sort((a, b) => {
        const fa = PAIRS.find(p => a.schedule[p.n] && a.schedule[p.n] !== 'home');
        const fb = PAIRS.find(p => b.schedule[p.n] && b.schedule[p.n] !== 'home');
        return (fa ? fa.n : 99) - (fb ? fb.n : 99);
      });

      // --- Заголовок: люди ---
      const headCells = data.map(person => {
        const isMe = person.name.toLowerCase() === myName;
        return `
          <th class="${isMe ? 'is-me-col' : ''}">
            <span class="th-name">${escapeHtml(person.name)}</span>
            ${isMe ? '<span class="th-me">это ты</span>' : ''}
            ${isMe ? `<button class="th-del" data-name="${escapeHtml(person.name)}" title="Удалить">✕</button>` : ''}
          </th>
        `;
      }).join('');

      // --- Строки: пары ---
      const rows = PAIRS.map(pair => {
        const cells = data.map(person => {
          const v = person.schedule[pair.n] || 'home';
          const isMe = person.name.toLowerCase() === myName;
          const cls = `cell cell-${v}${isMe ? ' is-me-col' : ''}`;
          return `<td class="${cls}">${ICONS[v]}</td>`;
        }).join('');

        return `
          <tr>
            <th>
              <span class="row-num">${pair.n} пара</span>
              <span class="row-time">${pair.time}</span>
            </th>
            ${cells}
          </tr>
        `;
      }).join('');

      // --- Строка счётчиков: сколько людей на паре / у кого окно / кто дома ---
      const countsCells = PAIRS.map(pair => {
        let nClass = 0, nWindow = 0;
        data.forEach(person => {
          const v = person.schedule[pair.n] || 'home';
          if (v === 'class') nClass++;
          else if (v === 'window') nWindow++;
        });
        const parts = [];
        if (nClass) parts.push(`📚${nClass}`);
        if (nWindow) parts.push(`☕${nWindow}`);
        return `<td>${parts.join(' ') || '—'}</td>`;
      }).join('');

      listEl.innerHTML = `
        <div class="table-wrap">
          <table class="schedule">
            <thead>
              <tr>
                <th class="corner">Пара \ Кто</th>
                ${headCells}
              </tr>
            </thead>
            <tbody>
              ${rows}
              <tr class="counts-row">
                <th>всего:</th>
                ${countsCells}
              </tr>
            </tbody>
          </table>
        </div>
      `;

      // Удаление
      listEl.querySelectorAll('.th-del').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const name = btn.dataset.name;
          if (!confirm(`Удалить «${name}» из общего расписания?`)) return;
          const { error } = await sb.from('schedules').delete().eq('name', name);
          if (error) { toast('Ошибка удаления', true); console.error(error); return; }
          localStorage.removeItem(NAME_KEY);
          nameEl.value = '';
          resetForm();
          toast('Удалено');
          loadAndRender();
        });
      });
    }

    // ---------- Сохранение ----------
    saveBtn.addEventListener('click', async () => {
      const name = nameEl.value.trim();
      if (!name) { toast('Введи имя'); nameEl.focus(); return; }

      const schedule = {};
      PAIRS.forEach(p => schedule[p.n] = state[p.n]);

      saveBtn.disabled = true;
      saveBtn.textContent = '⏳ Сохраняю…';

      const { error } = await sb
        .from('schedules')
        .upsert({ name, schedule, updated_at: new Date().toISOString() },
                { onConflict: 'name' });

      saveBtn.disabled = false;
      saveBtn.textContent = '💾 Сохранить';

      if (error) {
        console.error(error);
        toast('Ошибка: ' + error.message, true);
        return;
      }

      localStorage.setItem(NAME_KEY, name);
      toast('Сохранено ✓');
      loadAndRender();
    });

    refreshBtn.addEventListener('click', () => {
      loadAndRender();
      toast('Обновлено');
    });

    const savedName = localStorage.getItem(NAME_KEY);
    if (savedName) nameEl.value = savedName;

    renderPairs();
    loadAndRender();

    setInterval(loadAndRender, 30000);
  })();
  </script>
</body>
</html>
